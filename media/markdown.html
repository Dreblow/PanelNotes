<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>{{TITLE}}</title>

    <link
      rel="stylesheet"
      href="{{CSS_URI}}"
    >
  </head>

  <body>
    <button
      class="back-button"
      id="back-button"
    >
      ← Back
    </button>

    <div class="markdown">
      {{CONTENT}}
    </div>

    <script>
      const vscode = acquireVsCodeApi();

      document
        .getElementById("back-button")
        .addEventListener("click", () => {
          vscode.postMessage({
            command: "back"
          });
        });
    </script>
  </body>
</html>
